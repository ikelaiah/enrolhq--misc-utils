openapi: 3.0.3
info:
  title: EnrolHQ API
  version: v2
  description: Public API documentation
paths:
  /api/v2/accounts/check-email/:
    post:
      operationId: accounts_check_email_create
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v2/accounts/hijack-token/:
    post:
      operationId: accounts_hijack_token_create
      tags:
      - accounts
      responses:
        '200':
          description: No response body
  /api/v2/accounts/login/:
    post:
      operationId: accounts_login_create
      tags:
      - accounts
      responses:
        '200':
          description: No response body
  /api/v2/accounts/login/otp/:
    post:
      operationId: accounts_login_otp_create
      description: Exchange verified OTP token for parent dashboard session.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v2/accounts/login/send-otp-code/:
    post:
      operationId: accounts_login_send_otp_code_create
      description: Send login OTP code to parent email.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v2/accounts/logout/:
    post:
      operationId: accounts_logout_create
      tags:
      - accounts
      responses:
        '200':
          description: No response body
  /api/v2/accounts/password-reset/:
    post:
      operationId: accounts_password_reset_create
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v2/accounts/password-reset/confirm/:
    post:
      operationId: accounts_password_reset_confirm_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirm'
          description: ''
  /api/v2/accounts/refresh/:
    post:
      operationId: accounts_refresh_create
      tags:
      - accounts
      responses:
        '200':
          description: No response body
  /api/v2/accounts/refresh/create-permanent/:
    post:
      operationId: accounts_refresh_create_permanent_create
      tags:
      - accounts
      responses:
        '200':
          description: No response body
  /api/v2/accounts/roles/:
    get:
      operationId: accounts_roles_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleList'
          description: ''
    post:
      operationId: accounts_roles_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Role'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Role'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
  /api/v2/accounts/roles/{id}/:
    get:
      operationId: accounts_roles_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this role.
        required: true
      tags:
      - accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
    put:
      operationId: accounts_roles_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this role.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Role'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Role'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
  /api/v2/accounts/send-email-verification/:
    post:
      operationId: accounts_send_email_verification_create
      description: |-
        Send carer email address verification.
        In rare cases user can still have unverified email (google oauth, staff changes carer email).
      tags:
      - accounts
      responses:
        '200':
          description: No response body
  /api/v2/accounts/verify-email/:
    post:
      operationId: accounts_verify_email_create
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v2/application-statistics/:
    get:
      operationId: application_statistics_retrieve
      tags:
      - application-statistics
      responses:
        '200':
          description: No response body
  /api/v2/application-status-conversion/:
    get:
      operationId: application_status_conversion_retrieve
      tags:
      - application-status-conversion
      responses:
        '200':
          description: No response body
  /api/v2/applications/:
    get:
      operationId: applications_list
      description: Used for detail application view, detail actions and API list.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: updated_after
        schema:
          type: string
          format: date-time
      tags:
      - applications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationV2List'
          description: ''
    post:
      operationId: applications_create
      description: Create profile and parent.
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateStudentProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateStudentProfile'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStudentProfile'
          description: ''
  /api/v2/applications-list/:
    get:
      operationId: applications_list_list
      description: Used for list view and bulk actions.
      parameters:
      - in: query
        name: aboriginal_status
        schema:
          enum:
          - 0
          - 1
          - 2
        description: |-
          * `0` - No
          * `1` - Yes, Aboriginal
          * `2` - Yes, Torres Strait Islander
      - in: query
        name: all_application_statuses
