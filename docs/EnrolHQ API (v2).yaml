components:
  schemas:
    AboriginalStatusesEnum:
      enum:
      - 0
      - 1
      - 2
      type: integer
      description: |-
        * `0` - No
        * `1` - Yes, Aboriginal
        * `2` - Yes, Torres Strait Islander
    ActionEnum:
      enum:
      - SHOW_CONFIRMATION
      - REDIRECT_TO_PARENT_DASHBOARD
      - REDIRECT_TO_CUSTOM_FORM
      - REDIRECT_TO_ENROLMENT_OFFER
      - REDIRECT_TO_RESERVED_PLACE
      - REDIRECT_TO_URL
      type: string
      description: |-
        * `SHOW_CONFIRMATION` - Show Confirmation
        * `REDIRECT_TO_PARENT_DASHBOARD` - Redirect to Parent Dashboard
        * `REDIRECT_TO_CUSTOM_FORM` - Redirect to next custom form
        * `REDIRECT_TO_ENROLMENT_OFFER` - Redirect to enrolment offer acceptance page
        * `REDIRECT_TO_RESERVED_PLACE` - Redirect to reserved place acceptance page
        * `REDIRECT_TO_URL` - Redirect to URL
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        apartment:
          type: string
          maxLength: 100
        street_address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 50
        suburb:
          type: string
          maxLength: 50
        state:
          type: string
          maxLength: 32
        postcode:
          type: string
          maxLength: 10
        country:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            alpha_2_code:
              type: string
            alpha_3_code:
              type: string
            sacc_id:
              type: integer
          required:
          - id
