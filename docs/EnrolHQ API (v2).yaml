          * `-first_attendee_last_name` - First attendee last name (descending)
          * `-first_attendee_last_name` - -first attendee last name
          * `--first_attendee_last_name` - -first attendee last name (descending)
          * `first_student_last_name` - First student last name
          * `-first_student_last_name` - First student last name (descending)
          * `-first_student_last_name` - -first student last name
          * `--first_student_last_name` - -first student last name (descending)
